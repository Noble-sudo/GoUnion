<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The elite campus collective" />
    <meta name="theme-color" content="#030303" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Reconnected</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.webmanifest">
    <script>
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
        if (window.updatePwaStorePrompt) {
          window.updatePwaStorePrompt(e);
        }
      });

      // Force immediate Service Worker registration
      window.swError = null;
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('SW Registration successful:', reg);
              // Force update manually if stuck
              reg.update();
            })
            .catch(err => {
              console.error('SW Registration failed:', err);
              window.swError = err.toString();
            });
        });
      }
    </script>
</head>
  <body style="background-color: #030303; margin: 0; padding: 0;">
    <div id="root"></div>
    <div id="initial-splash" style="position: fixed; inset: 0; background-color: #030303; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; transition: opacity 0.5s ease-out;">
      <div style="width: 80px; height: 80px; background-color: #ffffff; border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;">
        <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 900; font-size: 56px; color: #030303; line-height: 1;">R</span>
      </div>
      <style>
        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: .7; transform: scale(0.95); }
        }
      </style>
    </div>
    <script>
      // Remove splash screen when React mounts
      const observer = new MutationObserver((mutations) => {
        const root = document.getElementById('root');
        if (root.children.length > 0) {
          const splash = document.getElementById('initial-splash');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(() => splash.remove(), 500);
          }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true });
    </script>
    <script type="module" src="/index.jsx"></script>
  </body>
</html>

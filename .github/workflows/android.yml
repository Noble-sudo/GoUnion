name: Android build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci

      - name: Build the web app
        run: npx vite build
        env:
          VITE_API_URL: https://konnect-backend-lk8h.onrender.com
          VITE_AUDIUS_API_KEY: ${{ secrets.VITE_AUDIUS_API_KEY }}

      - name: Create the Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Set version and permissions
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/minSdkVersion = 23/minSdkVersion = 24/" android/variables.gradle
          sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />\n</manifest>#" android/app/src/main/AndroidManifest.xml

      - name: Build the app bundle
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Sign the app bundle
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf "%s" "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          echo "Found: $AAB"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -keypass "$KEY_PASS" -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$KEY_ALIAS"
          cp "$AAB" "$RUNNER_TEMP/veecity.aab"
          rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: veecity-aab
          path: ${{ runner.temp }}/veecity.aab
          retention-days: 14
